[project]
name = "worldguessr-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.20.0,<2",
  "arq>=0.28,<1",
  "fastapi>=0.142.2,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.15.0,<3",
  "redis>=5.3,<6",
  "sqlalchemy>=2.1.1,<3",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-cov>=7.1,<8", "ruff>=0.16.10,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
