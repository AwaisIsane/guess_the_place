services:
  caddy:
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro,Z

  frontend:
    build:
      target: development
    command: ["sh", "-c", "npm install && npm run dev -- --port 8080"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app:Z
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]

  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --reload
      - --reload-dir
      - /app/app
    volumes: &backend-source
      - ./backend:/app:Z

  migrate:
    volumes: *backend-source

  worker:
    command: ["watchfiles", "--filter", "python", "arq app.worker.WorkerSettings", "/app/app"]
    volumes: *backend-source

volumes:
  frontend-node-modules:
