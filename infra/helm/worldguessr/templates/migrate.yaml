apiVersion: batch/v1
kind: Job
metadata:
  name: "worldguessr-migrate-{{ .Release.Revision }}"
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.images.backend.repository }}@{{ .Values.images.backend.digest }}"
          command: [alembic, upgrade, head]
          envFrom: [{ secretRef: { name: worldguessr-runtime } }]
